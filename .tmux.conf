# Session panes starting from 1 instead of 0
set -g base-index 1

set -g history-limit 10000

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# # to change from default (C-b) to C-a
# set -g prefix C-a
# unbind C-b

# Set the default terminal mode to 256color mode
# START:termcolor
# set -g default-terminal "xterm-256color"
# set-option -g default-terminal "screen-256color"
# set -g default-terminal "tmux-256color"
set -g default-terminal "screen-256color"
set -ag terminal-overrides ',xterm-256color*:RGB'
# END:termcolor

# enable activity alerts
#START:activity
setw -g monitor-activity on
set -g visual-activity on
#END:activity

# Hot reload conf file after change
#START
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."
# bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."
#END

# Mouse Settings
#START
# mouse mode on by default
set -g mouse on
# set -g mouse-resize-pane on
# set -g mouse-select-pane on
# set -g mouse-select-window on

# Use (hold) Alt-arrow keys to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Use (hold) Shift-arrow to switch window
bind -n S-Left previous-window
bind -n S-Right next-window

# Bind keys to vim style movement instead of arrows
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# to turn on/off
bind m set -g mouse on
bind M set -g mouse off

# START:resize pane
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R
# END:resize pane

